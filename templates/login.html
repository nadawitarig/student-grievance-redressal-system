{% extends 'base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="form-section">
    <div class="form-card compact-card">
        <div class="form-heading">
            <span class="eyebrow">Welcome back</span>
            <h1>Sign in to SGRS</h1>
            <p>Access your dashboard and grievance updates.</p>
        </div>
        <form method="post" class="stacked-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required value="{{ request.form.get('email', '') }}">

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button class="button button-full" type="submit">Sign in</button>
        </form>
        <p class="form-note">New student? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div>
</section>
{% endblock %}
